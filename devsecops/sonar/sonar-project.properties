# SonarQube project configuration for the on-premise SonarQube server.
# Used by the "sast" job of .github/workflows/devsecops.yml when the
# SONAR_HOST_URL variable (and SONAR_TOKEN secret) are configured.

sonar.projectKey=kimai-core
sonar.projectName=Kimai Time-Tracking
sonar.projectVersion=1.0

sonar.sources=src/,config/,templates/,public/index.php
sonar.tests=tests/
sonar.exclusions=var/**,vendor/**,node_modules/**,public/build/**,public/bundles/**,migrations/**,assets/**

sonar.php.file.suffixes=.php
sonar.sourceEncoding=UTF-8

# Security hotspots must be reviewed - the quality gate should fail on
# unresolved HIGH/CRITICAL hotspots and new blocker/critical issues.
