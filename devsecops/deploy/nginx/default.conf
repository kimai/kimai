# Hardened reverse proxy for the on-premise Kimai deployment.
# See devsecops/docs/DEPLOYMENT.md for the rationale of every directive.

# Rate limiting for authentication endpoints (brute force protection)
limit_req_zone $binary_remote_addr zone=kimai_login:10m rate=5r/m;

# HTTP -> HTTPS redirect (no content is ever served over plain HTTP)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ----------------------------------------------------------------------
    # TLS hardening
    # ----------------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/kimai.crt;
    ssl_certificate_key /etc/nginx/certs/kimai.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:KIMISSL:10m;
    ssl_session_tickets off;

    # ----------------------------------------------------------------------
    # Security headers (WSTG-CONF / OWASP Secure Headers Project)
    # ----------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Report-Only on purpose: a strict enforcing CSP would break the current
    # frontend (inline scripts/styles). Violations are logged for review, see
    # devsecops/docs/DEPLOYMENT.md before switching to enforcing mode.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;

    # ----------------------------------------------------------------------
    # Information disclosure
    # ----------------------------------------------------------------------
    server_tokens off;
    proxy_hide_header X-Powered-By;

    client_max_body_size 64m;

    # ----------------------------------------------------------------------
    # Deny access to sensitive files/paths (defense in depth)
    # ----------------------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
    location ~* /(composer\.(json|lock)|package\.json|\.env|\.git|README) {
        deny all;
        return 404;
    }

    # ----------------------------------------------------------------------
    # Rate limited login endpoints
    # ----------------------------------------------------------------------
    # /etc/nginx/proxy_params only exists in Debian nginx packages, not in the
    # alpine image - set the same headers explicitly
    location ~ ^/(en/)?(login|auth) {
        limit_req zone=kimai_login burst=10 nodelay;
        proxy_pass http://app:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://app:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # TRACE/TRACK are not needed and historically abused (XST)
    if ($request_method ~ ^(TRACE|TRACK)$) {
        return 405;
    }
}
