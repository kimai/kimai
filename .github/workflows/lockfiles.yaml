name: Check .lock files

on: # zizmor: ignore[dangerous-triggers] using the target branch workflow prevents adding new trustedAuthors
    pull_request_target: null
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    lockfiles:
        permissions:
            pull-requests: read # read the PR author
        runs-on: ubuntu-latest
        name: Verify lock file integrity
        steps:
            - name: Prevent file change
              uses: xalvarez/prevent-file-change-action@dbc67c205c9ed02aa39c497b422c24f364c3e8dd # v3.0.1
              with:
                  githubToken: ${{ secrets.GITHUB_TOKEN }}
                  pattern: .*\.lock$|^\.github\/.*$|^pnpm-lock.yaml$
                  # kevinpapst is the upstream maintainer, devzephyr is the owner of
                  # this fork and develops the DevSecOps pipeline under .github/
                  # (the action compares github.context.actor, so the Cursor app
                  # bot that pushes the automation commits must be listed as well)
                  trustedAuthors: kevinpapst,devzephyr,cursor[bot]
